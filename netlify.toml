[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The dev blog lives at /dev-blog and /dev-blog/<post>; the app routes it client-side
[[redirects]]
  from = "/dev-blog/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/dev-blog"
  to = "/index.html"
  status = 200

# Old blog and journal links
[[redirects]]
  from = "/blog/*"
  to = "/dev-blog/:splat"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/dev-blog"
  status = 301

[[redirects]]
  from = "/journal/*"
  to = "/dev-blog/:splat"
  status = 301

[[redirects]]
  from = "/journal"
  to = "/dev-blog"
  status = 301
