[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The blog lives at /blog and /blog/<post>; the app routes it client-side
[[redirects]]
  from = "/blog/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/index.html"
  status = 200

# Old journal links
[[redirects]]
  from = "/journal/*"
  to = "/blog/:splat"
  status = 301

[[redirects]]
  from = "/journal"
  to = "/blog"
  status = 301
